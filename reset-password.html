<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Reset password | Cole's Auto Detailing</title><style>
:root{--bg:#091018;--panel:#101e28;--accent:#5aefdf;--ink:#f3fbff;--muted:#9eb5c0}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px Arial,Helvetica,sans-serif}button,input,select,textarea{font:inherit}a{color:var(--accent)}header{border-bottom:1px solid #30545c;background:#0d2028}nav{max-width:1160px;margin:auto;padding:22px;display:flex;align-items:center;gap:18px;justify-content:space-between}main{max-width:1160px;margin:auto;padding:28px 20px 90px}h1{font-size:clamp(30px,4vw,52px);letter-spacing:-.05em}h2{margin:10px 0 18px}p{line-height:1.6;color:var(--muted)}section{border:1px solid #2b4b54;background:var(--panel);border-radius:10px;padding:22px;margin-bottom:18px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.tabs button{background:#18323b;color:#c8e0e5}button{border:0;background:var(--accent);color:#061c20;font-weight:750;border-radius:7px;padding:12px 15px;cursor:pointer}button:disabled{opacity:.5}.tabs button.active{background:var(--accent);color:#08191b}.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}label{display:block;color:#cee2e5;margin:12px 0;font-size:13px}input,select,textarea{width:100%;margin-top:7px;padding:12px;border:1px solid #43666c;border-radius:6px;background:#07171f;color:white}input[type=checkbox]{width:auto;margin:0 8px 0 0}.item{border-top:1px solid #30505a;padding:14px 0}.item:first-child{border:0}.item strong{display:block;font-size:16px}.item small{color:var(--muted)}.item button{margin:8px 8px 0 0;padding:8px 11px}.secondary{background:#1f3a43;color:#e9ffff}.danger{background:#754348;color:#fff}.muted{color:var(--muted)}.hidden{display:none!important}.card{padding:20px;background:#142a33;border:1px solid #31525c;border-radius:10px}.metric{font-size:30px;font-weight:bold;color:var(--accent);display:block;margin:9px 0}#status{background:#102f36;border-left:3px solid var(--accent);padding:11px 15px;margin:15px 0;color:#dffdfa;min-height:44px}.voice-row{display:flex;gap:8px}.voice-row input{margin:0}.voice-row button{white-space:nowrap}.thumbnail{width:110px;height:80px;object-fit:cover;border-radius:5px}#signout{display:none}@media(max-width:720px){.two,.three{grid-template-columns:1fr}nav{flex-wrap:wrap}.voice-row{flex-wrap:wrap}.voice-row input{flex:1;min-width:160px}}main{max-width:700px}[hidden]{display:none!important}.status{white-space:pre-wrap;overflow-wrap:anywhere}</style></head><body>
<header><nav><strong>COLE'S ✦ PARKER'S OFFICE</strong><a href="dashboard.html">Back to sign in</a></nav></header><main>
<section id="requestPanel"><h1>Forgot your password?</h1><p>Enter your business account email. We’ll send a link so you can choose a new password.</p>
<form id="requestForm"><label for="resetEmail">Email</label><input id="resetEmail" type="email" autocomplete="username" required><p><button id="sendReset" type="submit">Send reset email</button></p></form><p id="requestStatus" class="status" role="status" aria-live="polite"></p></section>
<section id="passwordPanel" hidden><h1>Set your password.</h1><p>Choose a password with at least 12 characters.</p><form id="passwordForm"><label for="newPassword">New password</label><input id="newPassword" type="password" minlength="12" autocomplete="new-password" required><label for="confirmPassword">Confirm new password</label><input id="confirmPassword" type="password" minlength="12" autocomplete="new-password" required><p><button id="savePassword" type="submit">Save password</button></p></form><p id="passwordStatus" class="status" role="status" aria-live="polite"></p><a href="dashboard.html">Return to sign in →</a></section>
</main><script type="module" src="reset-password.js"></script></body></html>
